[project]
name = "generative-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gyr0byte", email = "gqurav69@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "arxiv<4.0.0",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.1",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
